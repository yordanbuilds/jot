name: test

on:
  push:
    branches: [master]
  pull_request:

# Nothing here writes back to the repository, so the default token doesn't
# need to be able to.
permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script tests
        run: bash tests/scripts.test.sh
      - name: Manifest sanity
        run: |
          jq -e '.schemaVersion == 1
                 and .id == "yordanbuilds.jot"
                 and .kinds == ["overlay"]
                 and .entryPoints.overlay == "Jot.qml"' manifest.json
          test -f Jot.qml
